</style>
<rect width="1000" height="150" fill="url(#bg)"/>
<text class="t" x="500" y="62" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#e2e8f8">Gracias por visitar mi perfil</text>
