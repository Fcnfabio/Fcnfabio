<g transform="translate(0,95)"><g class="w2" opacity=".35"><path d="M0 0 Q125 -26 250 0 T500 0 Q625 -26 750 0 T1000 0 Q1125 -26 1250 0 T1500 0 Q1625 -26 1750 0 T2000 0 V80 H0 Z" fill="#a78bfa" transform="translate(0,14)"/></g><g class="w1" opacity=".55"><path d="M0 0 Q125 -26 250 0 T500 0 Q625 -26 750 0 T1000 0 Q1125 -26 1250 0 T1500 0 Q1625 -26 1750 0 T2000 0 V80 H0 Z" fill="#4f8ef7" transform="translate(0,26)"/></g></g>
