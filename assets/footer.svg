<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Gracias por visitar mi perfil">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b14"/><stop offset="1" stop-color="#151c38"/></linearGradient></defs>
<style>
  .w1{animation:wave 9s linear infinite} .w2{animation:wave 14s linear infinite reverse}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-500px)}}
